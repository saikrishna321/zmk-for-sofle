# Battery level report interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Increase keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# Change keyboard default display name
CONFIG_ZMK_KEYBOARD_NAME="Sofle"
# Fix battery report related bug on Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Boost BLE transmit power to +3 dBm (nRF52840) for a more stable
# split connection, while keeping peak radio current low enough for the
# peripheral to hold the link on battery
CONFIG_BT_CTLR_TX_PWR_PLUS_3=y

# Rotary encoder config
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Enable a widget to show words per minute
#CONFIG_ZMK_WIDGET_WPM_STATUS=n
#CONFIG_ZMK_WIDGET_LAYER_STATUS=n
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
# Bongo cat typing animation
#CONFIG_ZMK_WIDGET_BONGO_CAT=y

# Sleep config
# Milliseconds of inactivity before entering idle state (1 minute) —
# idle turns off the OLED and RGB, so keep this short to save battery
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse/pointing config
CONFIG_ZMK_POINTING=y

# ZMK Studio config
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB config
CONFIG_ZMK_RGB_UNDERGLOW=y
# Turn off RGB when keyboard enters idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
# Cut external power to the LED strip whenever RGB is off; the WS2812s
# draw ~0.5-1mA each even when dark, so leaving the rail on drains the
# battery in about a day
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
# Boot with RGB off to save power; toggle on with RGB_TOG when wanted
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
